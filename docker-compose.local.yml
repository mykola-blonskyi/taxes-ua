services:
  web:
    ports:
      - "3000:3000"

  api:
    environment:
      # A local stack has no pinned domain. Development is the environment where the api accepts any
      # host and serves the OpenAPI document `pnpm gen:api` reads.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=db;Port=5432;Database=taxes_ua;Username=taxes_ua;Password=taxes_ua
      # docker-compose.yml always sets this from PASSKEY_SERVER_DOMAIN, so a local run without a
      # .env hands the container an empty value, and an empty environment variable outranks
      # appsettings.Development.json. Without this line the api would refuse to start locally.
      Auth__Passkey__ServerDomain: localhost
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taxes_ua
      POSTGRES_USER: taxes_ua
      POSTGRES_PASSWORD: taxes_ua
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxes_ua -d taxes_ua"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
