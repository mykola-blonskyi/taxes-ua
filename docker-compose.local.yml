services:
  web:
    ports:
      # WEB_PORT lets the end-to-end suite publish its own stack beside a developer's one on 3000.
      # Loopback only: the stack serves the Development sign-in, which must not be reachable from a
      # shared network.
      - "127.0.0.1:${WEB_PORT:-3000}:3000"

  api:
    environment:
      # A local stack has no pinned domain. Development is the environment where the api accepts any
      # host and serves the OpenAPI document `pnpm gen:api` reads.
      ASPNETCORE_ENVIRONMENT: Development
      # The Development sign-in exists only with this flag as well (#180). Behind web's rewrite the api
      # sees a container address, so the flag, not the caller's IP, is what enables it.
      Auth__DevelopmentSignIn: "true"
      ConnectionStrings__Default: Host=db;Port=5432;Database=taxes_ua;Username=taxes_ua;Password=taxes_ua
      # docker-compose.yml always sets this from PASSKEY_SERVER_DOMAIN, so a local run without a
      # .env hands the container an empty value, and an empty environment variable outranks
      # appsettings.Development.json. Without this line the api would refuse to start locally.
      Auth__Passkey__ServerDomain: localhost
      # A fixed, obviously-fake dev key (ADR-011), so a local stack can exercise the connected
      # monobank state without generating one. Never reused outside this local override.
      Monobank__TokenEncryptionKeyBase64: dGF4ZXMtdWEtbG9jYWwtZGV2LWtleS0zMi1ieXRlcyE=
      # Points the Telegram client at a stub Bot API on the host for the browser proof; empty uses the
      # real one.
      Telegram__BaseUrl: ${TELEGRAM_BASE_URL:-}
      # The same for monobank, for the browser proof of the reserve jar; empty uses the real one.
      Monobank__BaseUrl: ${MONOBANK_BASE_URL:-}
      # The same for the NBU exchange rates, for the end-to-end suite; empty uses the real one.
      Nbu__BaseUrl: ${NBU_BASE_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: taxes_ua
      POSTGRES_USER: taxes_ua
      POSTGRES_PASSWORD: taxes_ua
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxes_ua -d taxes_ua"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
