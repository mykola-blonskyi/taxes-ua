<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Немає мережі · Податки ФОП 3 групи</title>
  <style>
    html, body { margin: 0; }
    body { display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; font-family: system-ui, sans-serif; background: #fff; color: #0a0a0a; text-align: center; }
    main { max-width: 22rem; }
    h1 { font-size: 1.125rem; margin: 0 0 .5rem; }
    p { margin: 0 0 1rem; font-size: .875rem; color: #525252; }
    button { font: inherit; font-size: .875rem; padding: .5rem 1rem; border: 1px solid #d4d4d4; border-radius: .5rem; background: transparent; color: inherit; }
    section[hidden] { display: none; }
    @media (prefers-color-scheme: dark) {
      body { background: #0a0a0a; color: #fafafa; }
      p { color: #a3a3a3; }
      button { border-color: #404040; }
    }
  </style>
</head>
<body>
  <!-- Static on purpose: the service worker serves this file when a navigation fails, so it cannot depend on the app or the api. The text mirrors `offline` in messages/uk.json and messages/ru.json. -->
  <main>
    <section lang="uk" id="offline-uk">
      <h1>Немає мережі</h1>
      <p>Дані не оновлено. Перевірте з’єднання й спробуйте ще раз.</p>
      <button type="button" data-retry>Спробувати знову</button>
    </section>
    <section lang="ru" id="offline-ru" hidden>
      <h1>Нет сети</h1>
      <p>Данные не обновлены. Проверьте соединение и попробуйте снова.</p>
      <button type="button" data-retry>Попробовать снова</button>
    </section>
  </main>
  <script>
    (function () {
      var match = document.cookie.match(/(?:^|; )locale=([^;]*)/);
      var ru = match ? match[1] === "ru" : false;
      document.documentElement.lang = ru ? "ru" : "uk";
      document.getElementById("offline-uk").hidden = ru;
      document.getElementById("offline-ru").hidden = !ru;
      var buttons = document.querySelectorAll("[data-retry]");
      for (var i = 0; i < buttons.length; i++) buttons[i].addEventListener("click", function () { location.reload(); });
    })();
  </script>
</body>
</html>
