name: Set up web
description: Node, pnpm with its store cached, and the locked dependencies of web/.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        # pnpm arrives with corepack in the next step, so the automatic package-manager cache would not find it.
        package-manager-cache: false
    - run: corepack enable
      shell: bash
    - id: pnpm-store
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      shell: bash
      working-directory: web
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-
    - run: pnpm install --frozen-lockfile
      shell: bash
      working-directory: web
