version: 2
updates:
  # Actions are pinned by commit SHA with a version comment; Dependabot moves both together.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup-web
    schedule:
      interval: weekly
  - package-ecosystem: nuget
    directory: /api
    schedule:
      interval: weekly
    groups:
      test-tooling:
        patterns:
          - "Microsoft.NET.Test.Sdk"
          - "xunit*"
          - "coverlet.collector"
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    ignore:
      # The runtime is Node 24 (web/Dockerfile, .github/actions/setup-web). Move this when they move.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      next:
        patterns: ["next", "eslint-config-next"]
      npm-minor-patch:
        update-types: ["minor", "patch"]
