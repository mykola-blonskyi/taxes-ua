name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api-test:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test api/TaxesUa.slnx

  web-lint-build:
    name: Web lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # pnpm arrives with corepack in the next step, so the automatic package-manager cache would not find it.
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  web-test:
    name: Web tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # pnpm arrives with corepack in the next step, so the automatic package-manager cache would not find it.
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  docker-api:
    name: Build API image
    runs-on: ubuntu-latest
    needs: api-test
    steps:
      - uses: actions/checkout@v7
      - run: docker build ./api

  docker-web:
    name: Build web image
    runs-on: ubuntu-latest
    needs: web-lint-build
    steps:
      - uses: actions/checkout@v7
      - run: docker build ./web

  deploy-checks:
    name: Deploy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: deploy/check-compose.sh
      - run: deploy/smoke-test.sh

  deploy:
    name: Deploy to Coolify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [api-test, web-lint-build, web-test, docker-api, docker-web, deploy-checks]
    steps:
      - name: Trigger the Coolify deploy webhook
        # Coolify's /deploy route answers an authenticated GET with 405 despite its docs; it takes POST.
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_WEBHOOK_TOKEN: ${{ secrets.COOLIFY_WEBHOOK_TOKEN }}
        run: |
          case "$COOLIFY_WEBHOOK_URL" in
            */api/v1/deploy\?*uuid=*) ;;
            *)
              echo "::error::COOLIFY_WEBHOOK_URL must be the resource's Deploy Webhook (auth required), https://<coolify>/api/v1/deploy?uuid=<uuid>&force=false"
              exit 1
              ;;
          esac
          case "$COOLIFY_WEBHOOK_URL$COOLIFY_WEBHOOK_TOKEN" in
            *[[:space:]]*|*\"*|*\'*)
              echo "::error::COOLIFY_WEBHOOK_URL or COOLIFY_WEBHOOK_TOKEN contains whitespace or quotes; paste the bare value"
              exit 1
              ;;
          esac
          echo "url length ${#COOLIFY_WEBHOOK_URL}, token length ${#COOLIFY_WEBHOOK_TOKEN}"
          status=$(curl --silent --show-error --max-time 60 --output response.txt --write-out '%{http_code}' \
            --request POST "$COOLIFY_WEBHOOK_URL" --header "Authorization: Bearer $COOLIFY_WEBHOOK_TOKEN")
          echo "Coolify answered $status"
          head -c 500 response.txt; echo
          test "$status" = 200
