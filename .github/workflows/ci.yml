name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api-test:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test api/TaxesUa.slnx

  web-lint-build:
    name: Web lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # pnpm arrives with corepack in the next step, so the automatic package-manager cache would not find it.
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  web-test:
    name: Web tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # pnpm arrives with corepack in the next step, so the automatic package-manager cache would not find it.
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # pnpm arrives with corepack in the next step, so the automatic package-manager cache would not find it.
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Builds the Compose stack, runs the suite against it and removes the stack with its volumes.
      - run: pnpm e2e
      - name: Keep the report and traces of a failed run
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/e2e/playwright-report/
            web/e2e/test-results/
          retention-days: 14

  docker-api:
    name: Build API image
    runs-on: ubuntu-latest
    needs: api-test
    steps:
      - uses: actions/checkout@v7
      - run: docker build ./api

  docker-web:
    name: Build web image
    runs-on: ubuntu-latest
    needs: web-lint-build
    steps:
      - uses: actions/checkout@v7
      - run: docker build ./web

  deploy-checks:
    name: Deploy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: deploy/check-compose.sh
      - run: deploy/smoke-test.sh

  deploy:
    name: Deploy to Coolify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [api-test, web-lint-build, web-test, e2e, docker-api, docker-web, deploy-checks]
    # Two deploy jobs never run at once, and this group never cancels one that is running. It does not
    # stop the workflow's own concurrency (ci-<ref>) from cancelling an older run, deploy job included,
    # when a newer push arrives; the webhook has fired by then and Coolify keeps deploying.
    concurrency:
      group: deploy-coolify
      cancel-in-progress: false
    steps:
      - name: Trigger the Coolify deploy webhook
        # Coolify's /deploy route answers an authenticated GET with 405 despite its docs; it takes POST.
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_WEBHOOK_TOKEN: ${{ secrets.COOLIFY_WEBHOOK_TOKEN }}
        run: |
          case "$COOLIFY_WEBHOOK_URL" in
            */api/v1/deploy\?*uuid=*) ;;
            *)
              echo "::error::COOLIFY_WEBHOOK_URL must be the resource's Deploy Webhook (auth required), https://<coolify>/api/v1/deploy?uuid=<uuid>&force=false"
              exit 1
              ;;
          esac
          case "$COOLIFY_WEBHOOK_URL$COOLIFY_WEBHOOK_TOKEN" in
            *[[:space:]]*|*\"*|*\'*)
              echo "::error::COOLIFY_WEBHOOK_URL or COOLIFY_WEBHOOK_TOKEN contains whitespace or quotes; paste the bare value"
              exit 1
              ;;
          esac
          echo "url length ${#COOLIFY_WEBHOOK_URL}, token length ${#COOLIFY_WEBHOOK_TOKEN}"
          status=$(curl --silent --show-error --max-time 60 --output response.txt --write-out '%{http_code}' \
            --request POST "$COOLIFY_WEBHOOK_URL" --header "Authorization: Bearer $COOLIFY_WEBHOOK_TOKEN")
          echo "Coolify answered $status"
          head -c 500 response.txt; echo
          test "$status" = 200

      - name: Wait for this commit to report healthy
        # /api/health carries the commit the running container was built from (App__Release, set from
        # Coolify's SOURCE_COMMIT, read by the api from its environment). The old release answers ok too, so health alone proves nothing: wait
        # for the new commit. A migration that fails, or a dump that fails before it, keeps it from
        # appearing, and the job fails at the timeout.
        env:
          HEALTH_URL: https://taxes.blonskyi.dev/api/health
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          deadline=$((SECONDS + 900))
          while [ "$SECONDS" -lt "$deadline" ]; do
            body=$(curl --silent --max-time 10 "$HEALTH_URL" || true)
            status=$(jq -r '.status // empty' <<<"$body" 2>/dev/null || true)
            release=$(jq -r '.release // empty' <<<"$body" 2>/dev/null || true)
            echo "status=${status:-none} release=${release:-none}"
            if [ "$status" = ok ] && [ "${#release}" -ge 7 ] && [ "$release" != unknown ]; then
              case "$EXPECTED_SHA" in "$release"*) echo "Release $release is healthy"; exit 0 ;; esac
              case "$release" in "$EXPECTED_SHA"*) echo "Release $release is healthy"; exit 0 ;; esac
            fi
            sleep 15
          done
          echo "::error::$HEALTH_URL did not report status ok for commit $EXPECTED_SHA within 15 minutes. Check the Coolify deployment log and docs/deploy.md, Rollback."
          exit 1
