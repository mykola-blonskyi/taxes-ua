name: CI

on:
  # A branch with an open PR is built once, by the pull_request run. Only main also runs on push, which
  # is the run that deploys.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The shards run in parallel and the job below them keeps the required check name "API tests".
  api-test-shard:
    name: API tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each shard takes whole features, and "rest" is the complement of the other four (with the
          # engine tests), so a new feature folder or test class lands in a shard without an edit here.
          # Sized from per-class trx durations: Monobank ~240 s of test time, Backup ~190 s, Notifications
          # ~170 s, Payments+Declarations+Invoices+Settings ~340 s, the rest ~290 s.
          - shard: monobank
            filter: FullyQualifiedName~Api.Tests.Features.Monobank.
          - shard: backup
            filter: FullyQualifiedName~Api.Tests.Features.Backup.
          - shard: notifications
            filter: FullyQualifiedName~Api.Tests.Features.Notifications.
          - shard: payments-declarations-invoices-settings
            filter: FullyQualifiedName~Api.Tests.Features.Payments.|FullyQualifiedName~Api.Tests.Features.Declarations.|FullyQualifiedName~Api.Tests.Features.Invoices.|FullyQualifiedName~Api.Tests.Features.Settings.
          - shard: rest
            filter: FullyQualifiedName!~Api.Tests.Features.Monobank.&FullyQualifiedName!~Api.Tests.Features.Backup.&FullyQualifiedName!~Api.Tests.Features.Notifications.&FullyQualifiedName!~Api.Tests.Features.Payments.&FullyQualifiedName!~Api.Tests.Features.Declarations.&FullyQualifiedName!~Api.Tests.Features.Invoices.&FullyQualifiedName!~Api.Tests.Features.Settings.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('api/**/*.csproj', 'api/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet test api/TaxesUa.slnx --filter "${{ matrix.filter }}" --logger "trx;LogFilePrefix=${{ matrix.shard }}" --results-directory api/TestResults
      - name: Keep the test results of a failed run
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: api-trx-${{ matrix.shard }}
          path: api/TestResults/
          retention-days: 14

  api-test:
    name: API tests
    if: always()
    needs: api-test-shard
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        run: test "${{ needs.api-test-shard.result }}" = success

  web-lint-build:
    name: Web lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Only the schema check below uses this: it starts the API in Development, which migrates on start.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: taxes_ua
          POSTGRES_USER: taxes_ua
          POSTGRES_PASSWORD: taxes_ua
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taxes_ua"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-web
      - run: pnpm lint
      # tsconfig includes .next/types, which typegen writes without a build.
      - run: pnpm exec next typegen
      - run: pnpm typecheck
      - run: pnpm build
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('api/**/*.csproj', 'api/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Schema types match the API
        working-directory: .
        run: .github/scripts/check-api-schema.sh

  web-test:
    name: Web tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-web
      - run: pnpm test

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-web
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # The browser download is skipped on a cache hit; the system packages it needs are not cached.
      - run: pnpm exec playwright install --with-deps chromium
        if: steps.browsers.outputs.cache-hit != 'true'
      - run: pnpm exec playwright install-deps chromium
        if: steps.browsers.outputs.cache-hit == 'true'
      - name: Pull the base images, retrying
        working-directory: .
        run: .github/scripts/prepull-images.sh
      # Builds the Compose stack, runs the suite against it and removes the stack with its volumes.
      - run: pnpm e2e
      - name: Keep the report and traces of a failed run
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/e2e/playwright-report/
            web/e2e/test-results/
          retention-days: 14

  docker-api:
    name: Build API image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Pull the base images, retrying
        run: .github/scripts/prepull-images.sh
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ./api
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  docker-web:
    name: Build web image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Pull the base images, retrying
        run: .github/scripts/prepull-images.sh
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ./web
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy-checks:
    name: Deploy checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Pull the base images, retrying
        run: .github/scripts/prepull-images.sh
      - run: deploy/check-compose.sh
      - run: deploy/smoke-test.sh

  deploy:
    name: Deploy to Coolify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [api-test, web-lint-build, web-test, e2e, docker-api, docker-web, deploy-checks]
    # Two deploy jobs never run at once, and this group never cancels one that is running. It does not
    # stop the workflow's own concurrency (ci-<ref>) from cancelling an older run, deploy job included,
    # when a newer push arrives; the webhook has fired by then and Coolify keeps deploying.
    concurrency:
      group: deploy-coolify
      cancel-in-progress: false
    steps:
      - name: Trigger the Coolify deploy webhook
        # Coolify's /deploy route answers an authenticated GET with 405 despite its docs; it takes POST.
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_WEBHOOK_TOKEN: ${{ secrets.COOLIFY_WEBHOOK_TOKEN }}
        run: |
          case "$COOLIFY_WEBHOOK_URL" in
            */api/v1/deploy\?*uuid=*) ;;
            *)
              echo "::error::COOLIFY_WEBHOOK_URL must be the resource's Deploy Webhook (auth required), https://<coolify>/api/v1/deploy?uuid=<uuid>&force=false"
              exit 1
              ;;
          esac
          case "$COOLIFY_WEBHOOK_URL$COOLIFY_WEBHOOK_TOKEN" in
            *[[:space:]]*|*\"*|*\'*)
              echo "::error::COOLIFY_WEBHOOK_URL or COOLIFY_WEBHOOK_TOKEN contains whitespace or quotes; paste the bare value"
              exit 1
              ;;
          esac
          echo "url length ${#COOLIFY_WEBHOOK_URL}, token length ${#COOLIFY_WEBHOOK_TOKEN}"
          status=$(curl --silent --show-error --max-time 60 --output response.txt --write-out '%{http_code}' \
            --request POST "$COOLIFY_WEBHOOK_URL" --header "Authorization: Bearer $COOLIFY_WEBHOOK_TOKEN")
          echo "Coolify answered $status"
          head -c 500 response.txt; echo
          test "$status" = 200

      - name: Wait for this commit to report healthy
        # /api/health carries the commit the running container was built from (App__Release, set from
        # Coolify's SOURCE_COMMIT, read by the api from its environment). The old release answers ok too, so health alone proves nothing: wait
        # for the new commit. A migration that fails, or a dump that fails before it, keeps it from
        # appearing, and the job fails at the timeout.
        env:
          HEALTH_URL: https://taxes.blonskyi.dev/api/health
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          deadline=$((SECONDS + 900))
          while [ "$SECONDS" -lt "$deadline" ]; do
            body=$(curl --silent --max-time 10 "$HEALTH_URL" || true)
            status=$(jq -r '.status // empty' <<<"$body" 2>/dev/null || true)
            release=$(jq -r '.release // empty' <<<"$body" 2>/dev/null || true)
            echo "status=${status:-none} release=${release:-none}"
            if [ "$status" = ok ] && [ "${#release}" -ge 7 ] && [ "$release" != unknown ]; then
              case "$EXPECTED_SHA" in "$release"*) echo "Release $release is healthy"; exit 0 ;; esac
              case "$release" in "$EXPECTED_SHA"*) echo "Release $release is healthy"; exit 0 ;; esac
            fi
            sleep 15
          done
          echo "::error::$HEALTH_URL did not report status ok for commit $EXPECTED_SHA within 15 minutes. Check the Coolify deployment log and docs/deploy.md, Rollback."
          exit 1
