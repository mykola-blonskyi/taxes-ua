name: Update auto-merge branches

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: update-auto-merge-branches
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    name: Update branches behind main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Update every auto-merge PR that is behind
        env:
          GH_TOKEN: ${{ secrets.AUTO_UPDATE_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::AUTO_UPDATE_TOKEN is not set, so no branch was updated. See docs/deploy.md, Keeping auto-merge branches current."
            exit 0
          fi
          for attempt in 1 2 3; do
            prs=$(gh pr list --state open --limit 100 --json number,autoMergeRequest,mergeStateStatus \
              --jq '.[] | select(.autoMergeRequest != null) | "\(.number) \(.mergeStateStatus)"')
            case "$prs" in *UNKNOWN*) sleep 10 ;; *) break ;; esac
          done
          failed=0
          while read -r pr status; do
            [ "$status" = BEHIND ] || continue
            if gh pr update-branch "$pr"; then
              echo "Updated #$pr"
            else
              echo "::warning::Could not update #$pr"
              failed=1
            fi
          done <<<"$prs"
          exit "$failed"
