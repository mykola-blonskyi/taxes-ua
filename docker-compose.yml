services:
  web:
    build:
      context: ./web
      args:
        API_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"

  api:
    build: ./api
    # As PID 1 the runtime's abort on an unhandled exception is ignored, so a startup guard that
    # throws leaves the container up and unhealthy instead of exiting. An init process fixes that.
    init: true
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: ${DATABASE_URL:-}
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Auth__AllowedEmails: ${ALLOWED_EMAILS:-}
      AllowedHosts: ${ALLOWED_HOSTS:-}
      Auth__Passkey__ServerDomain: ${PASSKEY_SERVER_DOMAIN:-}
      DataProtection__KeysPath: /var/lib/taxes-ua/keys
    volumes:
      - dataprotection-keys:/var/lib/taxes-ua/keys
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  dataprotection-keys:
