services:
  web:
    build:
      context: ./web
      args:
        API_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"

  api:
    build: ./api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: ${DATABASE_URL:-}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
