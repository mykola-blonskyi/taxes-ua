services:
  web:
    restart: unless-stopped
    mem_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    build:
      context: ./web
      args:
        API_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  api:
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    build: ./api
    # As PID 1 the runtime's abort on an unhandled exception is ignored, so a startup guard that
    # throws leaves the container up and unhealthy instead of exiting. An init process fixes that.
    init: true
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: ${DATABASE_URL:-}
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Auth__AllowedEmails: ${ALLOWED_EMAILS:-}
      AllowedHosts: ${ALLOWED_HOSTS:-}
      Auth__Passkey__ServerDomain: ${PASSKEY_SERVER_DOMAIN:-}
      DataProtection__KeysPath: /var/lib/taxes-ua/keys
      Monobank__TokenEncryptionKeyBase64: ${MONOBANK_TOKEN_ENCRYPTION_KEY:-}
      Monobank__PublicBaseUrl: ${MONOBANK_PUBLIC_BASE_URL:-}
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN:-}
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-}
      Smtp__Tls: ${SMTP_TLS:-}
      Smtp__User: ${SMTP_USER:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__From: ${SMTP_FROM:-}
      App__PublicUrl: ${APP_PUBLIC_URL:-}
      Migrations__DumpDirectory: /var/lib/taxes-ua/dumps
    volumes:
      - dataprotection-keys:/var/lib/taxes-ua/keys
      - migration-dumps:/var/lib/taxes-ua/dumps
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      # The pre-migration dump and the migration run before the api listens; a slow one must not fail
      # the deploy.
      start_period: 300s
      retries: 3

  # Encrypted pg_dump of the app database to S3-compatible storage every night, and a weekly restore of the
  # newest dump into a throwaway cluster (ADR-031). It reaches the database through the same DATABASE_URL.
  backup:
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    build: ./deploy/backup
    init: true
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_CHECK_AGE_IDENTITY: ${BACKUP_CHECK_AGE_IDENTITY:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      BACKUP_OFFSITE_S3_ENDPOINT: ${BACKUP_OFFSITE_S3_ENDPOINT:-}
      BACKUP_OFFSITE_S3_BUCKET: ${BACKUP_OFFSITE_S3_BUCKET:-}
      BACKUP_OFFSITE_S3_ACCESS_KEY: ${BACKUP_OFFSITE_S3_ACCESS_KEY:-}
      BACKUP_OFFSITE_S3_SECRET_KEY: ${BACKUP_OFFSITE_S3_SECRET_KEY:-}
      BACKUP_OFFSITE_S3_REGION: ${BACKUP_OFFSITE_S3_REGION:-}

volumes:
  dataprotection-keys:
  migration-dumps:
